<!doctype html>
<!--
THESIS: The promise in one gesture: a painted band crowded with busywork, and the helper in the headline clears it.
OWN-WORLD: Painted Showroom. The hero headline and its ink helper on white; the jobs stage's field painting left untouched; white pills carrying each helper's hue; the Example pill; the step check; one ink action.
STORY: Small jobs drift across the painting. A wave of checks sweeps left to right while the headline helper watches; the band clears, the helper smiles, and the closing question appears. Then new busywork drifts back in.
FIRST VIEWPORT: Frame 0 is a finished card: logo, headline, a band of real jobs over the painting. The centre is texture only.
FORM: Busywork band (obi-band challenger fused with 5 of 7 · ae877dd0).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og:video C · Busywork band</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./shared/og.css" />
    <style>
      .top {
        position: absolute;
        top: 46px;
        left: 0;
        right: 0;
        display: grid;
        justify-items: center;
        gap: 14px;
      }

      .top .logo {
        font-size: 28px;
      }

      .title {
        font-size: 80px;
        font-weight: 500;
        line-height: 1.06;
        letter-spacing: -0.028em;
        white-space: nowrap;
      }

      .h1-helper {
        display: inline-block;
        width: 0.98em;
        height: 0.98em;
        margin: 0 0.02em;
        vertical-align: -0.17em;
      }

      /* The jobs stage as a band: painting untouched, rounded on top, running off the bottom. */
      .band {
        position: absolute;
        top: 232px;
        left: 40px;
        right: 40px;
        bottom: -40px;
        isolation: isolate;
        overflow: hidden;
        border-radius: 32px;
        background: #c9c4a6;
      }

      .band-art {
        position: absolute;
        inset: 0;
        z-index: -1;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 46%;
      }

      .band > .example-tag {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 1;
        padding: 4px 13px 5px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.9);
        color: var(--ink-2);
        font-size: 18px;
        font-weight: 500;
        line-height: 1.4;
      }

      .rows {
        position: absolute;
        top: 66px;
        left: 0;
      }

      .row {
        position: absolute;
        display: flex;
        gap: 14px;
      }

      .job {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        height: 64px;
        padding: 0 26px 0 9px;
        border-radius: 999px;
        background: #fff;
        box-shadow: var(--lift);
        font-size: 25px;
        font-weight: 500;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }

      .job-avatar {
        position: relative;
        flex: none;
        width: 46px;
        height: 46px;
      }

      .job-avatar .helper {
        width: 100%;
        height: 100%;
      }

      .job-done {
        position: absolute;
        inset: -2px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--ok-soft);
        color: var(--ok);
      }

      .job-done .icon {
        stroke-width: 2.4;
      }

      .ask-wrap {
        position: absolute;
        inset: 0 0 64px;
        display: grid;
        place-items: center;
      }

      .ask {
        display: grid;
        justify-items: center;
        gap: 28px;
        padding: 40px 56px 44px;
        border-radius: 24px;
        background: #fff;
        box-shadow: var(--float);
      }

      .ask h2 {
        font-size: 50px;
        font-weight: 500;
        line-height: 1.1;
        letter-spacing: -0.022em;
        white-space: nowrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        height: 64px;
        padding: 0 30px;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <main class="og">
      <header class="top">
        <div class="logo"><span data-logo-mark></span><span class="logo-word">Seestemic</span></div>
        <h1 class="title">Let <span data-helper="h1"></span> AI handle the busywork</h1>
      </header>

      <section class="band">
        <img class="band-art" src="/src/assets/art/field.webp" alt="" />
        <span class="example-tag">Example</span>
        <div class="rows"></div>
        <div class="ask-wrap">
          <div class="ask">
            <h2>What should AI take off your plate?</h2>
            <span class="btn">Book a free AI review</span>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import { blink, boot, happy, helperSVG, icon, look, pop, show } from "./shared/og.js";

      const D = 10;
      const $ = (s) => document.querySelector(s);

      // Helper hues from src/data/helpers.ts. Every label is a verbatim site string: the two teammate
      // asks from src/pages/index.astro, the rest from the helper threads and phone cards in src/data/helpers.ts.
      const HUE = {
        quotes: "#F07C3A",
        inbox: "#2FB39A",
        frontDesk: "#7A5CFA",
        invoices: "#E9558B",
        bookkeeping: "#6BAF4B",
        questions: "#2E9EFF",
        report: "#E8B22F",
        handbook: "#4A5BD4",
      };

      // [direction, px per second, left edge in the band, jobs]. Orders and offsets keep the strongest
      // strings whole in the poster, stagger the rows, and never clip a pill by a hair at either edge.
      const ROWS = [
        [1, 16, -350, [["questions", "Hi, do you deliver on Saturdays?"], ["invoices", "Chase the café’s late invoice"], ["inbox", "48 new emails arrived overnight"], ["report", "Time for your weekly summary"]]],
        [-1, 20, -358, [["bookkeeping", "61 receipts arrived by email and photo in March"], ["quotes", "New request from a dental clinic"], ["handbook", "How do I process a return without a receipt?"], ["frontDesk", "Can you move my 16:00 today to Friday?"]]],
        [1, 18, -96, [["frontDesk", "14 conversations came in after closing time"], ["inbox", "Reply to new reviews in my tone"], ["invoices", "23 payments came in this week"], ["quotes", "Flooring for 3 rooms · 4 photos"]]],
        [-1, 22, -144, [["inbox", "Refund request · Order 5127"], ["bookkeeping", "Fuel · €86.40"], ["invoices", "Two invoices are more than 30 days late"], ["report", "Week 12 summary"]]],
      ];
      const PITCH = 86;

      $(".rows").innerHTML = ROWS.map(
        ([, , left, jobs], r) =>
          `<ul class="row" style="top:${r * PITCH}px;left:${left}px">${jobs
            .map(
              ([id, text]) =>
                `<li class="job"><span class="job-avatar">${helperSVG({ color: HUE[id], happy: false })}<span class="job-done">${icon("check", 26)}</span></span>${text}</li>`,
            )
            .join("")}</ul>`,
      ).join("");
      $('[data-helper="h1"]').outerHTML = helperSVG({ cls: "h1-helper" });

      function build(tl) {
        const helper = $(".h1-helper");
        const BAND_W = $(".band").offsetWidth;
        const SWEEP_AT = 1.7;
        const SWEEP_FOR = 2.7;
        const BACK_FROM = 7.85;
        const BACK_TO = 9.45;
        const CUT = 6; // every pill is gone by now, so the drift can jump back unseen

        // Rows drift at a constant speed and jump back once, while the band is empty.
        const drift = (d, v, t) => (t < CUT ? d * v * (t + 2.1) : d * v * (t - 7.9));
        const x = (px) => ({ transform: `translateX(${px}px)` });

        const jobs = [];
        document.querySelectorAll(".row").forEach((row, r) => {
          const [d, v] = ROWS[r];
          tl.track(row, [
            [0, x(drift(d, v, 0)), "linear"],
            [CUT, x(d * v * (CUT + 2.1))],
            [CUT, x(drift(d, v, CUT)), "linear"],
            [D, x(drift(d, v, D))],
          ]);

          [...row.children].forEach((job) => {
            const left = row.offsetLeft + job.offsetLeft;
            const width = job.offsetWidth;
            // The sweep checks a pill when it reaches the middle of the part that's on screen.
            let t = 3;
            let seen = false;
            for (let k = 0; k < 6; k++) {
              const L = left + drift(d, v, t);
              const a = Math.max(0, L);
              const b = Math.min(BAND_W, L + width);
              seen = a < b;
              const mid = seen ? (a + b) / 2 : Math.min(BAND_W, Math.max(0, L + width / 2));
              t = SWEEP_AT + SWEEP_FOR * (mid / BAND_W) + r * 0.1;
            }
            jobs.push({ job, t, seen });
          });
        });

        // New work trickles back in a fixed shuffled order, evenly spaced.
        const shuffled = jobs.map((_, i) => i).sort((a, b) => ((a * 7 + 3) % jobs.length) - ((b * 7 + 3) % jobs.length));
        shuffled.forEach((i, rank) => {
          jobs[i].back = BACK_FROM + ((BACK_TO - BACK_FROM) * rank) / (jobs.length - 1);
        });

        for (const { job, t, back } of jobs) {
          // The check takes the helper's place: the face shrinks away as the disc pops in.
          pop(tl, job.querySelector(".job-done"), [[t, t + 0.75]], { from: { opacity: 0, transform: "scale(0.8)" }, out: 0 });
          show(
            tl,
            job.querySelector(".job-avatar .helper"),
            [
              [0, t],
              [t + 0.75, D],
            ],
            {
              from: { opacity: 0, transform: "scale(0)" },
              to: { opacity: 1, transform: "scale(1)" },
              gone: { opacity: 0, transform: "scale(0)" },
              dur: 0,
              out: 0.2,
            },
          );
          show(
            tl,
            job,
            [
              [0, t + 0.35],
              [back, D],
            ],
            {
              from: { opacity: 0, transform: "translateY(-14px)" },
              to: { opacity: 1, transform: "translateY(0px)" },
              gone: { opacity: 0, transform: "translateY(14px)" },
            },
          );
        }

        // The Example tag labels the depicted work, so it leaves with the last pill and returns with the first.
        const lastOut = Math.max(...jobs.filter((j) => j.seen).map((j) => j.t)) + 0.35;
        show(
          tl,
          ".band > .example-tag",
          [
            [0, lastOut],
            [BACK_FROM, D],
          ],
          { from: { opacity: 0 }, to: { opacity: 1 }, dur: 0.3 },
        );

        show(tl, ".ask", [[5.0, 7.55]], {
          from: { opacity: 0, transform: "translateY(12px)" },
          to: { opacity: 1, transform: "translateY(0px)" },
          dur: 0.55,
          out: 0.35,
        });

        // The headline helper watches the sweep, smiles at the empty band, reads the question, then sees new work arrive.
        look(tl, helper, [
          [0, 0, 0],
          [1.15, -6, 7],
          [1.75, 6, 7, 2.8, "inout"],
          [4.7, 0, 2, 0.4],
          [6.4, 0, 7],
          [8.0, -5, 6],
          [8.8, 5, 6, 0.6],
          [9.5, 0, 0],
        ]);
        happy(tl, helper, [[4.75, 6.3]]);
        const pose = (lift) => ({ transform: lift ? "translateY(-3%) rotate(-2deg)" : "translateY(0%) rotate(0deg)" });
        tl.track(helper, [
          [0, pose(false)],
          [4.75, pose(false), "out"],
          [5.2, pose(true)],
          [6.25, pose(true), "out"],
          [6.7, pose(false)],
        ]);
        blink(tl, helper, [0.6, 7.3]);
      }

      boot(build, { duration: D, poster: 0 });
    </script>
  </body>
</html>
